name: CI/CD

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build docker images
        run: |
          docker build -t cart_service:v1 ./CartService
          docker build -t product_service:v1 ./ProductService
          docker build -t user_service:v1 ./UserService

  deploy:
    name: Deploy Stage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Build images inside Minikube
        run: |
          eval $(minikube -p minikube docker-env)
          docker build -t cart-service:v1 ./CartService
          docker build -t product-service:v1 ./ProductService
          docker build -t user-service:v1 ./UserService

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/base

      - name: Wait for pods
        run: kubectl wait --for=condition=Ready pod --all --timeout=180s

      - name: Check cluster
        run: kubectl get pods -A