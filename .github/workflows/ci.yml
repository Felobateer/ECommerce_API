name: CI/CD

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  deploy:
    name: Minikube Test Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Build images inside Minikube
        run: |
          eval $(minikube -p minikube docker-env)
          docker build -t cart-service:v1 ./CartService
          docker build -t product-service:v1 ./ProductService
          docker build -t user-service:v1 ./UserService

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/base -R

      - name: Wait for deployments
        run: kubectl rollout status deployment --all --timeout=180s --namespace=default

      - name: Check cluster
        run: kubectl get pods -A